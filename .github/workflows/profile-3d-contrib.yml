name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  push:
    branches:
      - src
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate 3D Contribution
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          
      - name: Deploy to output-3d branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 3D contrib 파일 확인
          if [ ! -d "profile-3d-contrib" ]; then
            echo "profile-3d-contrib directory not found"
            exit 0
          fi
          
          # output-3d 브랜치로 전환 (없으면 생성)
          git fetch origin output-3d || true
          
          if git rev-parse --verify origin/output-3d >/dev/null 2>&1; then
            echo "output-3d 브랜치 존재 - 체크아웃"
            git checkout -B output-3d origin/output-3d
          else
            echo "output-3d 브랜치 없음 - 새로 생성"
            git checkout --orphan output-3d
            git rm -rf . 2>/dev/null || true
          fi
          
          # profile-3d-contrib 디렉토리만 유지
          mkdir -p profile-3d-contrib
          git checkout src -- profile-3d-contrib/
          
          # 커밋 및 푸시
          git add profile-3d-contrib/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: update 3D contribution graph [skip ci]"
          git push -f origin output-3d
