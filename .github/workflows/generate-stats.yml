name: Generate Stats Images

on:
  push:
    branches: [ src ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 가져오기

      - name: Create generated directory
        run: mkdir -p generated

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&include_all_commits=true&count_private=true'
          path: generated/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=radical&hide_border=true&include_all_commits=true&count_private=true&exclude_repo=aihoshistar'
          path: generated/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate wakatime card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: wakatime
          options: 'username=${{ github.repository_owner }}&hide_progress=true&theme=radical&hide_border=true'
          path: generated/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 변경사항 확인
          if [ -z "$(ls -A generated)" ]; then
            echo "No files generated"
            exit 0
          fi
          
          # 생성된 파일을 임시 디렉토리로 백업
          echo "Backing up generated files..."
          cp -r generated /tmp/generated-backup
          
          # output 브랜치로 전환 (없으면 생성)
          git fetch origin output || true
          
          if git rev-parse --verify origin/output >/dev/null 2>&1; then
            echo "output 브랜치 존재 - 체크아웃"
            git checkout -B output origin/output
            # 기존 파일 제거
            rm -rf generated
          else
            echo "output 브랜치 없음 - 새로 생성"
            git checkout --orphan output
            git rm -rf . 2>/dev/null || true
          fi
          
          # 백업한 파일 복원
          echo "Restoring generated files..."
          mkdir -p generated
          cp -r /tmp/generated-backup/* generated/
          
          # 커밋 및 푸시
          git add generated/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: update stats images [skip ci]"
          git push -f origin output
